name: Deploy to GitHub Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Copy 404.html for SPA routing
        run: cp 404.html dist/404.html

      - name: Add redirect script to index.html
        run: |
          sed -i 's|</head>|<script>window.allPaths=["login","admin","teacher","tasks","profile"];if(window.allPaths.some(function(p){return location.pathname.indexOf("/"+p)!==-1})){var l=location;l.replace(l.protocol+"//"+l.hostname+(l.port?":"+l.port:"")+"/#/"+
          l.pathname.slice(1)+l.search+l.hash)}</script></head>|' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
