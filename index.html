<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniTasks - Demo Mode</title>
    <meta name="description" content="UniTasks - School task management system demo" />
    <!-- GitHub Pages SPA redirect -->
    <script>
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + l.search[0] + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-gray-900 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
